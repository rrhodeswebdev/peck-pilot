# Verified on a 2019 Intel MacBook (osx-64), 2026-11-09. Pins follow ADR 0002.
# Create: ~/miniforge3/bin/conda env create -f environment.yml
name: peck-pilot
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pythonocc-core=7.5.1
  # pip's latest cryptography has no py3.9 Intel-Mac wheel and tries to build with Rust
  - cryptography
  - pip
  - pip:
      - tensorflow==2.15.1  # 2.16+ ships Keras 3, which breaks Hierarchical CADNet
      - keras==2.15.0
      - numpy==1.26.4
      - h5py==3.14.0
      - scikit-learn==1.6.1
      - pytest==8.4.2
      - fastapi==0.128.8
      - uvicorn==0.39.0
      - python-multipart==0.0.20
      - httpx==0.28.1
